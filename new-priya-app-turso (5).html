<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffron Table — Order &amp; Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241C14;
    --ink-soft:#6B5E4F;
    --paper:#FAF6EF;
    --surface:#FFFFFF;
    --line:#E7DECE;
    --marigold:#D9962C;
    --marigold-deep:#B87A1A;
    --teal:#1F5C52;
    --teal-soft:#E4F0ED;
    --maroon:#9A3B3B;
    --maroon-soft:#F7E7E4;
    --amber-soft:#FBEFD8;
    --shadow: 0 1px 2px rgba(36,28,20,.06), 0 6px 20px rgba(36,28,20,.06);
    --radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F3ECDF;
      --ink-soft:#C9BCA5;
      --paper:#1B1611;
      --surface:#241D16;
      --line:#3A2F23;
      --marigold:#E6A83A;
      --marigold-deep:#F0BC5E;
      --teal:#4FA593;
      --teal-soft:#1C2E2A;
      --maroon:#D98080;
      --maroon-soft:#3A2222;
      --amber-soft:#33280F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F3ECDF;
    --ink-soft:#C9BCA5;
    --paper:#1B1611;
    --surface:#241D16;
    --line:#3A2F23;
    --marigold:#E6A83A;
    --marigold-deep:#F0BC5E;
    --teal:#4FA593;
    --teal-soft:#1C2E2A;
    --maroon:#D98080;
    --maroon-soft:#3A2222;
    --amber-soft:#33280F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  html,body{ height:100%; }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',Georgia,serif; }
  #app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* ---- Top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:40;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(155deg, var(--marigold), var(--marigold-deep));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:700; font-size:17px;
    flex-shrink:0;
  }
  .brand-text .name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; line-height:1.1; }
  .brand-text .role{ font-size:11.5px; color:var(--ink-soft); letter-spacing:.02em; margin-top:1px;}
  .role-switch{
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:3px;
  }
  .role-switch button{
    border:none; background:transparent; padding:6px 12px; border-radius:999px;
    font-family:'Inter'; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer;
  }
  .role-switch button.active{ background:var(--marigold); color:#fff; }

  main{ flex:1; padding:18px 18px calc(90px + env(safe-area-inset-bottom,0px)); }

  /* ---- Section headers ---- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .section-head h1{ font-size:23px; font-weight:600; margin:0; }
  .section-sub{ color:var(--ink-soft); font-size:13px; margin:2px 0 0; }

  /* ---- Table grid ---- */
  .table-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
  .table-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 14px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
    transition:transform .12s ease;
  }
  .table-card:active{ transform:scale(.97); }
  .table-card .tno{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .table-card .tstat{ font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .table-card.empty .dot{ background:#B7ADA0; }
  .table-card.empty .tstat{ color:var(--ink-soft); }
  .table-card.running{ border-color:var(--marigold); background:var(--amber-soft); }
  .table-card.running .dot{ background:var(--marigold-deep); }
  .table-card.running .tstat{ color:var(--marigold-deep); }
  .table-card.bill_ready{ border-color:var(--teal); background:var(--teal-soft); animation:pulseCard 1.8s ease-in-out infinite; }
  .table-card.bill_ready .dot{ background:var(--teal); }
  .table-card.bill_ready .tstat{ color:var(--teal); }
  @keyframes pulseCard{ 0%,100%{ box-shadow:var(--shadow);} 50%{ box-shadow:0 0 0 4px rgba(31,92,82,.18);} }
  .table-card .meta{ font-size:11.5px; color:var(--ink-soft); }

  /* ---- Toast / notification banner ---- */
  .banner{
    position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 4px);
    z-index:80; display:flex; justify-content:center; pointer-events:none;
  }
  .banner-inner{
    pointer-events:auto; max-width:560px; width:calc(100% - 32px);
    background:var(--teal); color:#fff; padding:12px 16px; border-radius:12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,.25);
    font-size:13.5px; font-weight:600; transform:translateY(-140%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .banner-inner.show{ transform:translateY(0); }

  /* ---- Waiter: category tabs & search ---- */
  .search-row{ display:flex; gap:8px; margin-bottom:12px; }
  .search-row input{
    flex:1; border:1px solid var(--line); background:var(--surface); border-radius:12px;
    padding:11px 14px; font-size:14px; color:var(--ink); font-family:'Inter';
  }
  .search-row input:focus{ outline:2px solid var(--marigold); outline-offset:1px; }
  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; scrollbar-width:none; }
  .cat-tabs::-webkit-scrollbar{ display:none; }
  .cat-tab{
    flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .cat-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  .item-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px;
    display:flex; flex-direction:column; gap:6px; position:relative; cursor:pointer; box-shadow:var(--shadow);
    min-height:86px; justify-content:space-between;
  }
  .item-card .iname{ font-size:13.5px; font-weight:600; line-height:1.25; }
  .item-card .iprice{ font-size:12.5px; color:var(--ink-soft); }
  .item-card .pop-badge{ position:absolute; top:8px; right:8px; font-size:9.5px; font-weight:700; color:var(--marigold-deep); background:var(--amber-soft); padding:2px 6px; border-radius:6px; }
  .qty-pill{
    position:absolute; bottom:10px; right:10px; background:var(--marigold); color:#fff; border-radius:999px;
    min-width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    padding:0 6px;
  }
  .item-card.has-qty{ border-color:var(--marigold); }

  /* ---- Cart dock ---- */
  .cart-dock{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    max-width:640px; margin:0 auto;
    padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
    background:var(--surface); border-top:1px solid var(--line);
    box-shadow:0 -6px 24px rgba(0,0,0,.08);
  }
  .cart-summary{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; cursor:pointer; }
  .cart-summary .csum-left{ font-size:13px; color:var(--ink-soft); }
  .cart-summary .csum-total{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; }
  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:13px 10px; font-size:14px; font-weight:700;
    font-family:'Inter'; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.primary{ background:var(--ink); color:var(--paper); }
  .btn.teal{ background:var(--teal); color:#fff; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); flex:0 0 auto; padding:13px 16px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.small{ padding:9px 14px; font-size:12.5px; flex:0 0 auto; }
  .btn.danger-outline{ background:transparent; border:1px solid var(--maroon); color:var(--maroon); }

  /* ---- Sheet / Modal ---- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(20,15,10,.45); z-index:90;
    display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--surface); width:100%; max-width:640px; border-radius:20px 20px 0 0;
    max-height:86vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(30px); transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .sheet-overlay.show .sheet{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 16px; }
  .sheet h2{ font-size:19px; margin:0 0 14px; }

  .cart-line{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .cart-line:last-child{ border-bottom:none; }
  .cart-line .cl-name{ font-size:14px; font-weight:600; flex:1; }
  .cart-line .cl-price{ font-size:12.5px; color:var(--ink-soft); }
  .stepper{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .stepper button{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--paper);
    font-size:16px; font-weight:700; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .stepper .qv{ min-width:18px; text-align:center; font-weight:700; font-size:14px; }

  /* ---- Bill preview ---- */
  .bill-box{ background:var(--paper); border:1px dashed var(--line); border-radius:12px; padding:16px; font-family:'Inter'; }
  .bill-head{ text-align:center; margin-bottom:10px; }
  .bill-head .hname{ font-family:'Fraunces',serif; font-weight:700; font-size:17px; }
  .bill-head .hmeta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .bill-row{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .bill-row.total{ font-weight:800; font-size:15.5px; border-top:1px dashed var(--line); margin-top:8px; padding-top:8px; }
  .bill-div{ border-top:1px dashed var(--line); margin:8px 0; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .em-icon{ font-size:34px; margin-bottom:10px; }

  /* Role picker (first load) */
  .role-pick{ display:flex; flex-direction:column; gap:14px; padding:40px 18px; }
  .role-pick .rp-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px;
    text-align:left; cursor:pointer; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow);
  }
  .role-pick .rp-emoji{ font-size:28px; }
  .role-pick .rp-title{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
  .role-pick .rp-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  /* settings link */
  .link-btn{ background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; }

  /* ---- Admin sub-nav ---- */
  .subnav{ display:flex; gap:8px; margin-bottom:16px; }
  .subnav button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .subnav button.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  /* ---- Manage lists (tables / menu / staff) ---- */
  .manage-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .manage-row .mr-main{ flex:1; min-width:0; }
  .manage-row .mr-title{ font-size:14px; font-weight:700; }
  .manage-row .mr-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .manage-row .mr-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--ink);
  }
  .icon-btn.danger{ color:var(--maroon); border-color:var(--maroon-soft); }
  .cat-group-title{ font-size:12px; font-weight:800; letter-spacing:.03em; color:var(--marigold-deep); margin:18px 0 8px; text-transform:uppercase; }
  .cat-group-title:first-child{ margin-top:0; }

  .fab{
    position:fixed; right:20px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:55;
    width:56px; height:56px; border-radius:50%; background:var(--marigold); color:#fff; border:none;
    font-size:26px; box-shadow:0 8px 24px rgba(0,0,0,.22); cursor:pointer; display:flex; align-items:center; justify-content:center;
    max-width:640px;
  }

  /* ---- Forms ---- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field select{
    width:100%; border:1px solid var(--line); background:var(--paper); border-radius:10px;
    padding:11px 12px; font-size:14px; color:var(--ink); font-family:'Inter';
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--marigold); outline-offset:1px; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:4px 0; }
  .switch{ position:relative; width:44px; height:26px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--line); border-radius:999px; cursor:pointer; transition:.2s; }
  .slider:before{ content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--marigold); }
  .switch input:checked + .slider:before{ transform:translateX(18px); }
  .cat-datalist-hint{ font-size:11px; color:var(--ink-soft); margin-top:5px; }
  .form-actions{ display:flex; gap:10px; margin-top:18px; }

  .staff-pick-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .staff-chip{
    border:1px solid var(--line); background:var(--surface); padding:10px 16px; border-radius:999px;
    font-size:13.5px; font-weight:700; cursor:pointer;
  }

  #printReceipt{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printReceipt, #printReceipt *{ visibility:visible; }
    #printReceipt{ display:block; position:absolute; top:0; left:0; width:80mm; padding:4mm; font-family:'Inter',monospace; }
    #printReceipt .pr-name{ text-align:center; font-weight:800; font-size:14px; }
    #printReceipt .pr-meta{ text-align:center; font-size:9px; margin-bottom:6px; }
    #printReceipt .pr-row{ display:flex; justify-content:space-between; font-size:10.5px; margin:2px 0; }
    #printReceipt hr{ border:none; border-top:1px dashed #000; margin:5px 0; }
    #printReceipt .pr-total{ font-weight:800; font-size:12px; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="banner" id="banner"><div class="banner-inner" id="bannerInner"></div></div>

  <div class="topbar">
    <div class="brand">
      <div class="mark" id="logoTap" style="cursor:pointer;">S</div>
      <div class="brand-text">
        <div class="name">Saffron Table</div>
        <div class="role" id="roleLabel">Order &amp; Billing Demo</div>
      </div>
    </div>
    <div class="role-switch" id="roleSwitch" style="display:none;">
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <main id="main"></main>
</div>

<!-- Cart sheet (waiter) -->
<div class="sheet-overlay" id="cartOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Table <span id="cartTableNo"></span> — Current Order</h2>
    <div id="cartLines"></div>
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button class="btn ghost" id="closeCart">Close</button>
    </div>
  </div>
</div>

<!-- Bill sheet (admin) -->
<div class="sheet-overlay" id="billOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Table <span id="billTableNo"></span> — Bill</h2>
    <div class="bill-box" id="billBox"></div>
    <div style="margin-top:16px; display:flex; gap:10px;">
      <button class="btn primary" id="printBillBtn">🖨️ Print Bill</button>
    </div>
    <div style="margin-top:10px; display:flex; gap:10px;">
      <button class="btn teal" id="markPaidBtn">Mark Paid &amp; Clear Table</button>
    </div>
    <div style="text-align:center; margin-top:14px;">
      <button class="link-btn" id="closeBill">Close without clearing</button>
    </div>
  </div>
</div>

<!-- Add/Edit Menu Item sheet -->
<div class="sheet-overlay" id="itemFormOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="itemFormTitle">Add Menu Item</h2>
    <div class="field">
      <label>Item name</label>
      <input type="text" id="ifName" placeholder="e.g. Paneer Lababdar">
    </div>
    <div class="field">
      <label>Price (₹)</label>
      <input type="number" id="ifPrice" placeholder="e.g. 240" min="0">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="ifCategory"></select>
      <div class="cat-datalist-hint">Don't see the right category? Choose "+ New category…" at the bottom of the list.</div>
    </div>
    <div class="field toggle-row">
      <label style="margin:0;">Mark as Popular</label>
      <label class="switch"><input type="checkbox" id="ifPopular"><span class="slider"></span></label>
    </div>
    <div class="form-actions">
      <button class="btn ghost" id="itemFormCancel">Cancel</button>
      <button class="btn primary" id="itemFormSave">Save Item</button>
    </div>
  </div>
</div>

<!-- Manage Tables sheet -->
<div class="sheet-overlay" id="tableMgmtOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Manage Tables</h2>
    <div id="tableMgmtList"></div>
    <div class="form-actions">
      <button class="btn ghost" id="closeTableMgmt">Close</button>
      <button class="btn primary" id="addTableBtn">+ Add Table</button>
    </div>
  </div>
</div>

<!-- Add Account sheet -->
<div class="sheet-overlay" id="staffFormOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="acctFormTitle">Add Account</h2>
    <div class="field">
      <label>Display name</label>
      <input type="text" id="sfName" placeholder="e.g. Ravi Kumar">
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="sfUsername" placeholder="e.g. ravi" autocapitalize="off" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="text" id="sfPin" placeholder="e.g. ravi@123" autocomplete="off">
    </div>
    <div class="field">
      <label>Access level</label>
      <select id="sfRole">
        <option value="user">User — take orders only</option>
        <option value="admin">Admin — full access</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn ghost" id="staffFormCancel">Cancel</button>
      <button class="btn primary" id="staffFormSave">Save Account</button>
    </div>
  </div>
</div>

<div id="printReceipt"></div>

<script>
(function(){
  "use strict";

  /* =========================================================================
     STEP 1 — PASTE YOUR TURSO DETAILS HERE
     (If you leave these blank, the app will ask for them on first load
      and remember them in this browser only — nothing is sent anywhere
      except directly to your own Turso database.)
  ========================================================================= */

  /* ---------------- Turso HTTP client (no library needed) ---------------- */
  function httpUrlFrom(raw){
    if(!raw) return "";
    return raw.replace(/^libsql:\/\//, "https://").replace(/\/+$/,"") + "/v2/pipeline";
  }
  function toTypedArg(v){
    if(v === null || v === undefined) return { type:"null" };
    if(typeof v === "number") return Number.isInteger(v) ? { type:"integer", value:String(v) } : { type:"float", value:v };
    if(typeof v === "boolean") return { type:"integer", value: v ? "1":"0" };
    return { type:"text", value:String(v) };
  }
  function fromTypedValue(cell){
    if(!cell || cell.type === "null") return null;
    if(cell.type === "integer" || cell.type === "float") return Number(cell.value);
    if(cell.type === "text") return cell.value;
    if(cell.type === "blob") return cell.base64;
    return cell.value;
  }

  let TURSO_TOKEN = TURSO_AUTH_TOKEN || localStorage.getItem("nt_turso_token") || "";

  async function tursoExec(sql, args){
    const endpoint = httpUrlFrom(TURSO_URL);
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Authorization": "Bearer " + TURSO_TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({
        requests: [
          { type:"execute", stmt: { sql, args: (args||[]).map(toTypedArg) } },
          { type:"close" }
        ]
      })
    });
    if(!res.ok){
      const txt = await res.text().catch(()=> "");
      throw new Error("Turso HTTP " + res.status + ": " + txt.slice(0,200));
    }
    const data = await res.json();
    const first = data.results[0];
    if(first.type === "error") throw new Error(first.error && first.error.message || "Turso query failed");
    const result = first.response.result;
    const cols = (result.cols||[]).map(c=>c.name);
    const rows = (result.rows||[]).map(row=>{
      const obj = {};
      row.forEach((cell,i)=>{ obj[cols[i]] = fromTypedValue(cell); });
      return obj;
    });
    return { rows, lastInsertRowid: result.last_insert_rowid, affectedRowCount: result.affected_row_count };
  }

    for(const sql of statements){ await tursoExec(sql, []); }

  async function loadTables(){

    const items = await tursoExec(`

    `, []);
    const cartByTableId = {};
    for(const row of items.rows){
      (cartByTableId[row.table_id] ||= []).push({ id: row.menu_item_id, name: row.name, price: row.price, qty: row.qty });
    }
    const next = {};
    for(const row of t.rows){
      next[row.number] = { id: row.id, number: row.number, status: row.status, updatedAt: row.updated_at, cart: cartByTableId[row.id] || [] };
    }
    return next;

  /* ---------------- Write operations (SQL) ---------------- */
  async function addToCart(tno, menuItemId, delta){
    const t = tables[tno];
    const existing = await tursoExec("SELECT * FROM order_items WHERE table_id = ? AND menu_item_id = ?", [t.id, menuItemId]);
    if(existing.rows.length){
      const newQty = existing.rows[0].qty + delta;
      if(newQty <= 0) await tursoExec("DELETE FROM order_items WHERE id = ?", [existing.rows[0].id]);
      else await tursoExec("UPDATE order_items SET qty = ? WHERE id = ?", [newQty, existing.rows[0].id]);
    } else if(delta > 0){
      await tursoExec("INSERT INTO order_items (table_id, menu_item_id, qty) VALUES (?, ?, ?)", [t.id, menuItemId, delta]);
    }
    const newStatus = t.status === "empty" ? "running" : t.status;
    await tursoExec("UPDATE restaurant_tables SET status=?, updated_at=? WHERE id=?", [newStatus, Date.now(), t.id]);
    await refreshAll();
  }

  async function setTableStatus(tno, status){
    const t = tables[tno];
    if(status === "empty") await tursoExec("DELETE FROM order_items WHERE table_id = ?", [t.id]);
    await tursoExec("UPDATE restaurant_tables SET status=?, updated_at=? WHERE id=?", [status, Date.now(), t.id]);
    await refreshAll();
  }

      </div>`;
    $("#setGstEnabled").addEventListener("change", ()=>{
      $("#gstinField").style.display = $("#setGstEnabled").checked ? "" : "none";
    });
    $("#disconnectDbBtn").onclick = ()=>{
      if(!confirm("Disconnect this device from the database? You will need the URL and token again to reconnect.")) return;
      localStorage.removeItem("nt_turso_url"); localStorage.removeItem("nt_turso_token");
      localStorage.removeItem("nt_session"); session = null;
      TURSO_URL=""; TURSO_TOKEN=""; connected=false;
      if(pollTimer) clearInterval(pollTimer);
      render();
    };
    $("#saveSettingsBtn").onclick = async ()=>{
      const name = $("#setHotelName").value.trim();
      const addr = $("#setHotelAddr").value.trim();
      const gstEnabled = $("#setGstEnabled").checked;
      const gstin = $("#setGstin").value.trim();
      await tursoExec("UPDATE settings SET value=? WHERE key='hotel_name'", [name]);
      await tursoExec("UPDATE settings SET value=? WHERE key='hotel_addr'", [addr]);
      await tursoExec("UPDATE settings SET value=? WHERE key='hotel_gstin'", [gstin]);
      await tursoExec("UPDATE settings SET value=? WHERE key='gst_enabled'", [gstEnabled?"1":"0"]);
      showBanner("Settings saved");
      await refreshAll();
    };
  }

  function renderAdminTables(){
    const body = $("#adminBody");
    const list = Object.values(tables).sort((a,b)=>a.number-b.number);
    const ready = list.filter(t=>t.status==="bill_ready").length;
    body.innerHTML = `
      <div class="section-head">
        <div><h1 style="font-size:20px;">Live Tables</h1><p class="section-sub">${ready>0? ready+" bill"+(ready>1?'s':'')+" ready to print" : "Refreshes every few seconds"}</p></div>
        <button class="link-btn" id="openTableMgmt">Manage tables</button>
      </div>
      <div class="table-grid">
        ${list.map(t=>`
          <button class="table-card ${t.status}" data-t="${t.number}">
            <div class="tno">${t.number}</div>
            <div class="tstat"><span class="dot"></span>${statusLabel(t.status)}</div>
            ${t.status!=="empty" ? `<div class="meta">${cartCount(t.cart)} items · ${money(cartTotal(t.cart))}</div>` : `<div class="meta">No customer</div>`}
          </button>`).join("") || `<div class="empty-state">No tables yet — tap "Manage tables" to add one.</div>`}
      </div>`;
    $$(".table-card", body).forEach(el=>{
      const n = Number(el.dataset.t);
      const t = tables[n];
      el.onclick = ()=>{
        if(t.status === "empty"){ showBanner("Table "+n+" is empty"); return; }
        openBillSheet(n);
      };
    });
    $("#openTableMgmt").onclick = openTableMgmt;
  }

  function openTableMgmt(){
    renderTableMgmtList();
    $("#tableMgmtOverlay").classList.add("show");
  }
  function renderTableMgmtList(){
    const list = Object.values(tables).sort((a,b)=>a.number-b.number);
    $("#tableMgmtList").innerHTML = list.map(t=>`
      <div class="manage-row">
        <div class="mr-main"><div class="mr-title">Table ${t.number}</div><div class="mr-sub">${statusLabel(t.status)}</div></div>
        <div class="mr-actions"><button class="icon-btn danger" data-remove="${t.number}" ${t.status!=='empty'?'disabled title="Table must be empty to remove"':''}>✕</button></div>
      </div>`).join("") || `<div class="empty-state">No tables yet.</div>`;
    $$("#tableMgmtList [data-remove]").forEach(b=>{
      b.onclick = async ()=>{
        const n = Number(b.dataset.remove);
        const t = tables[n];
        await tursoExec("DELETE FROM order_items WHERE table_id = ?", [t.id]);
        await tursoExec("DELETE FROM restaurant_tables WHERE id = ?", [t.id]);
        showBanner("Table "+n+" removed");
        await refreshAll();
        renderTableMgmtList();
      };
    });
  }
  $("#closeTableMgmt").onclick = ()=> $("#tableMgmtOverlay").classList.remove("show");
  $("#tableMgmtOverlay").addEventListener("click",(e)=>{ if(e.target.id==="tableMgmtOverlay") $("#tableMgmtOverlay").classList.remove("show"); });
  $("#addTableBtn").onclick = async ()=>{
    try{
      const maxRes = await tursoExec("SELECT COALESCE(MAX(number),0) as maxn FROM restaurant_tables", []);
      let next = (maxRes.rows[0].maxn || 0) + 1;
      try{
        await tursoExec("INSERT INTO restaurant_tables (number, status, updated_at) VALUES (?, 'empty', ?)", [next, Date.now()]);
      }catch(e){
        next += 1;
        await tursoExec("INSERT INTO restaurant_tables (number, status, updated_at) VALUES (?, 'empty', ?)", [next, Date.now()]);
      }
      showBanner("Table "+next+" added");
      await refreshAll();
      renderTableMgmtList();
    }catch(e){
      showBanner("Could not add table: " + (e.message||e));
    }
  };

  function computeBill(cart){
    const subtotal = cartTotal(cart);
    if(!GST.enabled) return { subtotal, cgst:0, sgst:0, total: Math.round(subtotal) };
    const cgst = +(subtotal*GST.cgst/100).toFixed(2);
    const sgst = +(subtotal*GST.sgst/100).toFixed(2);
    const total = Math.round(subtotal+cgst+sgst);
    return {subtotal,cgst,sgst,total};
  }

  function openBillSheet(tno){
    const t = tables[tno];
    const bill = computeBill(t.cart||[]);
    $("#billTableNo").textContent = t.number;
    $("#billBox").innerHTML = `
      <div class="bill-head">
        <div class="hname">${HOTEL.name}</div>
        <div class="hmeta">${HOTEL.addr}${GST.enabled && HOTEL.gstin ? `<br>GSTIN: ${HOTEL.gstin}` : ""}</div>
      </div>
      <div class="bill-div"></div>
      <div style="font-size:12px; color:var(--ink-soft); margin-bottom:4px;">Table ${t.number} · ${new Date().toLocaleString("en-IN")}</div>
      ${(t.cart||[]).map(c=>`<div class="bill-row"><span>${c.qty}× ${c.name}</span><span>${money(c.price*c.qty)}</span></div>`).join("")}
      <div class="bill-div"></div>
      ${GST.enabled ? `
      <div class="bill-row"><span>Subtotal</span><span>${money(bill.subtotal)}</span></div>
      <div class="bill-row"><span>CGST (${GST.cgst}%)</span><span>${money(bill.cgst)}</span></div>
      <div class="bill-row"><span>SGST (${GST.sgst}%)</span><span>${money(bill.sgst)}</span></div>` : ""}
      <div class="bill-row total"><span>Total</span><span>${money(bill.total)}</span></div>`;

    $("#printBillBtn").onclick = ()=> printBill(t, bill);
    $("#markPaidBtn").onclick = async ()=>{
      await setTableStatus(tno, "empty");
      $("#billOverlay").classList.remove("show");
      showBanner("Table "+t.number+" cleared for next guest");
    };
    $("#billOverlay").classList.add("show");
  }
  $("#closeBill").onclick = ()=> $("#billOverlay").classList.remove("show");
  $("#billOverlay").addEventListener("click",(e)=>{ if(e.target.id==="billOverlay") $("#billOverlay").classList.remove("show"); });

  function printBill(t, bill){
    const el = document.getElementById("printReceipt");
    el.innerHTML = `
      <div class="pr-name">${HOTEL.name}</div>
      <div class="pr-meta">${HOTEL.addr}${GST.enabled && HOTEL.gstin ? `<br>GSTIN: ${HOTEL.gstin}` : ""}</div>
      <hr>
      <div class="pr-row"><span>Table ${t.number}</span><span>${new Date().toLocaleString("en-IN")}</span></div>
      <hr>
      ${(t.cart||[]).map(c=>`<div class="pr-row"><span>${c.qty}x ${c.name}</span><span>${(c.price*c.qty).toLocaleString("en-IN")}</span></div>`).join("")}
      <hr>
      ${GST.enabled ? `
      <div class="pr-row"><span>Subtotal</span><span>${bill.subtotal.toLocaleString("en-IN")}</span></div>
      <div class="pr-row"><span>CGST ${GST.cgst}%</span><span>${bill.cgst.toLocaleString("en-IN")}</span></div>
      <div class="pr-row"><span>SGST ${GST.sgst}%</span><span>${bill.sgst.toLocaleString("en-IN")}</span></div>
      <hr>` : ""}
      <div class="pr-row pr-total"><span>TOTAL</span><span>Rs. ${bill.total.toLocaleString("en-IN")}</span></div>
      <hr>
      <div style="text-align:center;font-size:9px;">Thank you, visit again!</div>`;
    window.print();
  }

  /* ---- Admin: Menu tab ---- */
  function renderAdminMenu(){
    const body = $("#adminBody");
    const cats = categories();
    body.innerHTML = `
      <div class="section-head">
        <div><h1 style="font-size:20px;">Menu (${menuItems.length} items)</h1><p class="section-sub">Add, edit or remove items — everyone sees the change within a few seconds</p></div>
      </div>
      <div id="menuList">
        ${cats.map(cat=>`
          <div class="cat-group-title">${cat}</div>
          ${menuItems.filter(i=>i.category===cat).map(i=>`
            <div class="manage-row">
              <div class="mr-main"><div class="mr-title">${i.name} ${i.popular?'⭐':''}</div><div class="mr-sub">${money(i.price)}</div></div>
              <div class="mr-actions">
                <button class="icon-btn" data-edit="${i.id}">✎</button>
                <button class="icon-btn danger" data-del="${i.id}">✕</button>
              </div>
            </div>`).join("")}
        `).join("") || `<div class="empty-state">No menu items yet. Tap + to add your first item.</div>`}
      </div>`;
    $$("#menuList [data-edit]").forEach(b=> b.onclick = ()=> openItemForm(b.dataset.edit));
    $$("#menuList [data-del]").forEach(b=> b.onclick = async ()=>{
      const item = menuItems.find(m=>m.id===b.dataset.del);
      if(confirm("Remove \""+item.name+"\" from the menu?")){
        await tursoExec("DELETE FROM menu_items WHERE id = ?", [b.dataset.del]);
        showBanner("Item removed");
        await refreshAll();
      }
    });
    const fab = document.createElement("button");
    fab.className = "fab"; fab.id = "fabBtn"; fab.textContent = "+";
    fab.onclick = ()=> openItemForm(null);
    document.body.appendChild(fab);
  }

  const NEW_CATEGORY_VALUE = "__new__";
  function populateCategorySelect(selected){
    const cats = categories();
    const sel = $("#ifCategory");
    sel.innerHTML = cats.map(c=>`<option value="${c.replace(/"/g,'&quot;')}">${c}</option>`).join("")
      + `<option value="${NEW_CATEGORY_VALUE}">+ New category…</option>`;
    if(selected && cats.includes(selected)) sel.value = selected;
    else if(cats.length) sel.value = cats[0];
  }
  function openItemForm(itemId){
    editingItemDocId = itemId;
    if(itemId){
      const it = menuItems.find(m=>m.id===itemId);
      $("#itemFormTitle").textContent = "Edit Menu Item";
      $("#ifName").value = it.name; $("#ifPrice").value = it.price;
      populateCategorySelect(it.category);
      $("#ifPopular").checked = !!it.popular;
    } else {
      $("#itemFormTitle").textContent = "Add Menu Item";
      $("#ifName").value = ""; $("#ifPrice").value = ""; $("#ifPopular").checked = false;
      populateCategorySelect(null);
    }
    $("#itemFormOverlay").classList.add("show");
  }
  $("#ifCategory").addEventListener("change", ()=>{
    const sel = $("#ifCategory");
    if(sel.value !== NEW_CATEGORY_VALUE) return;
    const existing = categories();
    let name = prompt("New category name:");
    if(name === null){ populateCategorySelect(existing[0]||null); return; }
    name = name.trim();
    if(!name){ populateCategorySelect(existing[0]||null); return; }
    const dupe = existing.find(c=> c.toLowerCase() === name.toLowerCase());
    if(dupe){ showBanner('Category "'+dupe+'" already exists — selected it for you'); populateCategorySelect(dupe); return; }
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name + " (new)";
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = name;
  });
  $("#itemFormCancel").onclick = ()=> $("#itemFormOverlay").classList.remove("show");
  $("#itemFormOverlay").addEventListener("click",(e)=>{ if(e.target.id==="itemFormOverlay") $("#itemFormOverlay").classList.remove("show"); });
  $("#itemFormSave").onclick = async ()=>{
    const name = $("#ifName").value.trim();
    const price = Number($("#ifPrice").value);
    const category = $("#ifCategory").value;
    const popular = $("#ifPopular").checked;
    if(!name || !price || price<=0 || !category || category===NEW_CATEGORY_VALUE){ alert("Please fill item name, a valid price, and pick or create a category."); return; }
    if(editingItemDocId){
      await tursoExec("UPDATE menu_items SET name=?, price=?, category=?, popular=?, updated_at=? WHERE id=?",
        [name, price, category, popular?1:0, Date.now(), editingItemDocId]);
      showBanner("Item updated");
    } else {
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") + "-" + Date.now().toString(36).slice(-4);
      await tursoExec("INSERT INTO menu_items (id, name, price, category, popular, updated_at) VALUES (?, ?, ?, ?, ?, ?)",
        [id, name, price, category, popular?1:0, Date.now()]);
      showBanner("Item added to menu");
    }
    $("#itemFormOverlay").classList.remove("show");
    await refreshAll();
  };

  /* ---- Admin: Users tab (account management) ---- */
  function renderAdminStaff(){
    const body = $("#adminBody");
    body.innerHTML = `
      <div class="section-head">
        <div><h1 style="font-size:20px;">Users</h1><p class="section-sub">Accounts that can sign in — give each staff member their own username &amp; password</p></div>
      </div>
      <div id="staffList">
        ${accounts.map(a=>`
          <div class="manage-row">
            <div class="mr-main">
              <div class="mr-title">${a.display_name || a.username} ${a.role==='admin' ? '👑 Admin' : ''}</div>
              <div class="mr-sub">Username: ${a.username}</div>
            </div>
            <div class="mr-actions">
              <button class="icon-btn" data-edit="${a.id}">✎</button>
              <button class="icon-btn danger" data-del="${a.id}" ${session && session.id===a.id ? 'disabled title="You cannot delete your own account while signed in"':''}>✕</button>
            </div>
          </div>`).join("") || `<div class="empty-state">No accounts yet.</div>`}
      </div>`;
    $$("#staffList [data-edit]").forEach(b=> b.onclick = ()=> openAccountForm(Number(b.dataset.edit)));
    $$("#staffList [data-del]").forEach(b=> b.onclick = async ()=>{
      const a = accounts.find(x=>x.id===Number(b.dataset.del));
      if(confirm('Remove the account "'+a.username+'"?')){
        await tursoExec("DELETE FROM accounts WHERE id = ?", [a.id]);
        showBanner("Account removed");
        await refreshAll();
      }
    });
    const fab = document.createElement("button");
    fab.className = "fab"; fab.id = "fabBtn"; fab.textContent = "+";
    fab.onclick = ()=> openAccountForm(null);
    document.body.appendChild(fab);
  }
  function openAccountForm(accountId){
    editingAccountId = accountId;
    if(accountId){
      const a = accounts.find(x=>x.id===accountId);
      $("#acctFormTitle").textContent = "Edit Account";
      $("#sfName").value = a.display_name || "";
      $("#sfUsername").value = a.username;
      $("#sfPin").value = a.password;
      $("#sfRole").value = a.role;
    } else {
      $("#acctFormTitle").textContent = "Add Account";
      $("#sfName").value = ""; $("#sfUsername").value = ""; $("#sfPin").value = ""; $("#sfRole").value = "user";
    }
    $("#staffFormOverlay").classList.add("show");
  }
  $("#staffFormCancel").onclick = ()=> $("#staffFormOverlay").classList.remove("show");
  $("#staffFormOverlay").addEventListener("click",(e)=>{ if(e.target.id==="staffFormOverlay") $("#staffFormOverlay").classList.remove("show"); });
  $("#staffFormSave").onclick = async ()=>{
    const name = $("#sfName").value.trim();
    const username = $("#sfUsername").value.trim();
    const password = $("#sfPin").value;
    const role = $("#sfRole").value;
    if(!name || !username || !password){ alert("Please fill display name, username and password."); return; }
    try{
      if(editingAccountId){
        await tursoExec("UPDATE accounts SET display_name=?, username=?, password=?, role=? WHERE id=?",
          [name, username, password, role, editingAccountId]);
        if(session && session.id===editingAccountId){
          session = { id: editingAccountId, username, role, displayName: name };
          localStorage.setItem("nt_session", JSON.stringify(session));
          updateTopbarForSession();
        }
        showBanner("Account updated");
      } else {
        await tursoExec("INSERT INTO accounts (username, password, role, display_name) VALUES (?, ?, ?, ?)",
          [username, password, role, name]);
        showBanner("Account created");
      }
      $("#staffFormOverlay").classList.remove("show");
      await refreshAll();
    }catch(e){
      alert("Could not save: that username may already be taken.");
    }
  };

  /* ---------------- Boot ---------------- */
  updateTopbarForSession();
  boot();
})();
</script>
</body>
</html>
